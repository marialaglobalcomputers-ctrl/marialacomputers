<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mariala AI Assistant</title>

<!-- PWA installability -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0f2340" />

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mariala AI" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />

<style>
  :root {
    --navy: #0f2340;
    --gold: #b8922a;
    --cream: #f4f1ea;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--cream);
  }
  #app {
    display: flex; flex-direction: column; height: 100vh;
    height: 100dvh; /* respects mobile browser chrome */
  }
  header {
    background: var(--navy); color: var(--cream);
    padding: 14px 16px calc(14px + env(safe-area-inset-top)) 16px;
    padding-top: max(14px, env(safe-area-inset-top));
    border-bottom: 2px solid var(--gold);
    display: flex; align-items: center; gap: 10px;
  }
  header img { width: 30px; height: 30px; border-radius: 6px; }
  header .title { font-size: 15px; font-weight: 600; }
  header .subtitle { font-size: 11.5px; opacity: 0.75; margin-top: 1px; }

  #messages {
    flex: 1; overflow-y: auto; padding: 14px;
  }
  .msg { margin-bottom: 12px; line-height: 1.5; max-width: 85%; font-size: 14.5px; }
  .msg.user {
    margin-left: auto; background: var(--navy); color: var(--cream);
    padding: 10px 13px; border-radius: 12px 12px 2px 12px;
  }
  .msg.bot {
    background: #fff; color: var(--navy); border: 1px solid #ddd6c4;
    padding: 10px 13px; border-radius: 12px 12px 12px 2px;
  }
  .msg.system {
    color: #8a8574; font-size: 12.5px; text-align: center; margin: 10px 0;
  }

  form {
    display: flex; gap: 8px; padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    border-top: 1px solid #ddd6c4; background: #fff;
  }
  input {
    flex: 1; border: 1px solid #ccc3a8; border-radius: 8px;
    padding: 11px 13px; font-size: 15px; outline: none;
  }
  input:focus { border-color: var(--gold); }
  button {
    background: var(--gold); color: var(--navy); border: none;
    border-radius: 8px; padding: 0 18px; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
</style>
</head>
<body>
  <div id="app">
    <header>
      <img src="/icons/icon-192.png" alt="" />
      <div>
        <div class="title">Mariala AI Assistant</div>
        <div class="subtitle">Ask about any of our services</div>
      </div>
    </header>
    <div id="messages"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Type a message…" autocomplete="off" autofocus />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

<script>
  const messagesEl = document.getElementById("messages");
  const formEl = document.getElementById("form");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");
  let history = [];

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  addMessage("system", "Hi 👋 how can we help you today?");

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = inputEl.value.trim();
    if (!message) return;

    addMessage("user", message);
    inputEl.value = "";
    inputEl.disabled = true;
    sendEl.disabled = true;

    const thinking = document.createElement("div");
    thinking.className = "msg system";
    thinking.textContent = "Typing…";
    messagesEl.appendChild(thinking);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history }),
      });
      const data = await resp.json();
      thinking.remove();

      if (!resp.ok) {
        addMessage("system", "Sorry, the assistant is unavailable right now. Please reach us on WhatsApp instead.");
      } else {
        addMessage("bot", data.reply);
        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: data.reply });
        if (history.length > 20) history = history.slice(-20);
      }
    } catch (err) {
      thinking.remove();
      addMessage("system", "Connection error. Please try again in a moment.");
    } finally {
      inputEl.disabled = false;
      sendEl.disabled = false;
      inputEl.focus();
    }
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
</script>
</body>
</html>
